name: Deploy

on:
  # push a main desactivado hasta el primer despliegue manual y las variables AWS_ROLE_ARN/AWS_REGION
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC con AWS
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Sin `environment:`: el rol solo acepta el sub `repo:thoriphes/modepran-gestion:ref:refs/heads/main`.
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}         # opcional
      CERTIFICATE_ARN: ${{ vars.CERTIFICATE_ARN }} # opcional (us-east-1)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build -w @modepran/web

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: cdk deploy
        working-directory: packages/infra
        run: |
          ARGS=()
          if [ -n "$DOMAIN_NAME" ] && [ -n "$CERTIFICATE_ARN" ]; then
            ARGS+=(-c "domainName=$DOMAIN_NAME" -c "certificateArn=$CERTIFICATE_ARN")
          fi
          npx cdk deploy ModepranStack --require-approval never --outputs-file cdk-outputs.json "${ARGS[@]}"

      - name: Publicar la web
        run: |
          OUT=packages/infra/cdk-outputs.json
          BUCKET=$(jq -r '.ModepranStack.WebBucketName' "$OUT")
          DIST=$(jq -r '.ModepranStack.DistributionId' "$OUT")
          # Assets con hash: caché larga. config.json lo escribe el stack (BucketDeployment): no se toca.
          if [ -d packages/web/dist/_astro ]; then
            aws s3 sync packages/web/dist/_astro "s3://$BUCKET/_astro" --delete \
              --cache-control "public,max-age=31536000,immutable"
          fi
          aws s3 sync packages/web/dist "s3://$BUCKET" --delete \
            --exclude "_astro/*" --exclude "config.json" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*"
